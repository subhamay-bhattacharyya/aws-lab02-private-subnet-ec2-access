AWSTemplateFormatVersion: '2010-09-09'

Description: |
  Root CloudFormation template for AWS Networking Lab 02. Creates:
  - VPC with DNS support and hostnames, and an Internet Gateway (nested Vpc stack)
  - Public subnet with a default route to the Internet Gateway (nested PublicSubnets stack)
  - Private subnet without a default route to the Internet Gateway (nested PrivateSubnets stack)
  - Public SSH security group, open to 0.0.0.0/0 (nested PublicSg stack)
  - Private SSH security group, SSH only from the public SSH security group (nested PrivateSg stack)
  - EC2 instance in the public subnet (nested PublicEc2 stack)
  - EC2 instance in the private subnet (nested PrivateEc2 stack)

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Project Configuration"
        Parameters:
          - Project
          - Env
      - Label:
          default: "Nested Stack Configuration"
        Parameters:
          - TemplateBucket
      - Label:
          default: "VPC Configuration"
        Parameters:
          - VpcCidr
          - PublicCidrs
          - PrivateCidrs
      - Label:
          default: "Security Group Configuration"
        Parameters:
          - PublicSgName
          - PrivateSgName
      - Label:
          default: "EC2 Instance Configuration"
        Parameters:
          - AmiParam
          - InstanceType
          - KeyName
      - Label:
          default: "Advanced Configuration"
        Parameters:
          - CiSuffix
    ParameterLabels:
      TemplateBucket:
        default: "S3 Bucket Name"
      Project:
        default: "Project Name"
      Env:
        default: "Environment"
      VpcCidr:
        default: "VPC CIDR block (e.g., 10.0.0.0/16)"
      PublicCidrs:
        default: "Public Subnet CIDR blocks (comma-separated, e.g., 10.10.0.0/20)"
      PrivateCidrs:
        default: "Private Subnet CIDR blocks (comma-separated, e.g., 10.10.0.0/20)"
      PublicSgName:
        default: "SSH Only Security Group Public Subnet Base Name"
      PrivateSgName:
        default: "SSH Only Security Group Private Subnet Base Name"
      AmiParam:
        default: "EC2 Image (AMI) SSM Parameter"
      InstanceType:
        default: "EC2 Instance Type"
      KeyName:
        default: "EC2 Key Pair Name (for SSH)"
      CiSuffix:
        default: "CI CiSuffix"

Parameters:
  TemplateBucket:
    Type: String
    Default: "subhamay-cfn-templates-bucket-270453428528-us-east-1"
    Description: "S3 bucket name where the nested CloudFormation template is stored"
    MinLength: 3
    MaxLength: 63
    AllowedPattern: "^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
    ConstraintDescription: "S3 bucket name must be 3-63 characters, start and end with lowercase letter or number, and can contain hyphens and dots"

  Project:
    Type: String
    Default: "netwk-lab02"
    Description: "Project name to use as a bucket prefix"
    MinLength: 1
    MaxLength: 20
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Project name must be lowercase letters, numbers, and hyphens only"

  Env:
    Type: String
    Default: devl
    Description: "Deployment environment"
    AllowedValues:
      - devl
      - stag
      - prod
    ConstraintDescription: "Environment must be one of: devl, stag, prod"

  VpcCidr:
    Type: String
    Default: '10.100.0.0/16'
    Description: CIDR block for the VPC (e.g., 10.0.0.0/16)
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be valid CIDR block

  PublicCidrs:
    Type: String
    Default: "10.100.0.0/20"
    Description: "Comma-separated list of public subnet CIDR blocks (e.g., 10.10.0.0/20)"
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}(,\s*(\d{1,3}\.){3}\d{1,3}/\d{1,2})*$'
    ConstraintDescription: "Must be valid CIDR blocks, comma-separated"

  PrivateCidrs:
    Type: String
    Default: "10.100.16.0/20"
    Description: "Comma-separated list of private subnet CIDR blocks (e.g., 10.10.16.0/20)"
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}(,\s*(\d{1,3}\.){3}\d{1,3}/\d{1,2})*$'
    ConstraintDescription: "Must be valid CIDR blocks, comma-separated"

  CiSuffix:
    Type: String
    Default: ""
    Description: "Optional CI suffix to append to the bucket name"

  PublicSgName:
    Type: String
    Default: "ssh-public-sg"
    Description: "Base name for the SSH-only security group in the public subnet, combined with the project and environment names"
    MinLength: 1
    MaxLength: 30
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Security group base name must be lowercase letters, numbers, and hyphens only"

  PrivateSgName:
    Type: String
    Default: "ssh-private-sg"
    Description: "Base name for the SSH-only security group in the private subnet, combined with the project and environment names"
    MinLength: 1
    MaxLength: 30
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Security group base name must be lowercase letters, numbers, and hyphens only"

  AmiParam:
    Type: String
    Default: "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"
    Description: "SSM parameter that resolves to the EC2 image (AMI) ID for the instance. The default resolves to the latest Amazon Linux 2023 x86_64 AMI in the deployment region"

  InstanceType:
    Type: String
    Default: "t3.micro"
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
      - t2.micro
    Description: "EC2 instance type"
    ConstraintDescription: "Must be one of the allowed instance types"

  KeyName:
    Type: String
    Default: "networking-lab"
    Description: "Name of an existing EC2 key pair to use for SSH access. The console lists the key pairs available in this account and region"
    ConstraintDescription: "Must be the name of an existing EC2 key pair in this account and region"


Conditions:
  HasSuffix: !Not [!Equals [!Ref CiSuffix, ""]]

Resources:

  # VPC and Internet Gateway
  Vpc:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${TemplateBucket}.s3.us-east-1.amazonaws.com/cfn-nested-aws-vpc/template.yaml"
      Parameters:
          VPCCidrBlock: !Ref VpcCidr
          EnableDnsHostnames: "true"
          EnableInternetGateway: "true"
          VpcNameTag: !If
            - HasSuffix
            - !Sub "${Project}-${Env}-${AWS::Region}-${CiSuffix}"
            - !Sub "${Project}-${Env}-${AWS::Region}"
          Environment: !Ref Env
      Tags:
        - Key: Environment
          Value: !Ref Env
        - Key: Project
          Value: "Implement VPC with single public subnet and EC2 SSH"
        - Key: Component
          Value: NetworkingVPC
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 10

  # Public subnet with a default route to the Internet Gateway
  PublicSubnets:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${TemplateBucket}.s3.us-east-1.amazonaws.com/cfn-nested-aws-subnets/template.yaml"
      Parameters:
        VpcId: !GetAtt Vpc.Outputs.VPCId
        VpcName: !If
          - HasSuffix
          - !Sub "${Project}-${Env}-${CiSuffix}"
          - !Sub "${Project}-${Env}"
        AvailabilityZones: "us-east-1a"
        SubnetCidrBlocks: !Ref PublicCidrs
        SubnetCount: "1"
        SubnetQualifier: "public"
        InternetGatewayId: !GetAtt Vpc.Outputs.InternetGatewayId
      Tags:
        - Key: Environment
          Value: !Ref Env
        - Key: Project
          Value: "Implement VPC with single public subnet and EC2 SSH"
        - Key: Component
          Value: PublicSubnetsNestedStack
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 10

  # Private subnet. No Internet Gateway is passed, so the subnet has no default route
  PrivateSubnets:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${TemplateBucket}.s3.us-east-1.amazonaws.com/cfn-nested-aws-subnets/template.yaml"
      Parameters:
        VpcId: !GetAtt Vpc.Outputs.VPCId
        VpcName: !If
          - HasSuffix
          - !Sub "${Project}-${Env}-${CiSuffix}"
          - !Sub "${Project}-${Env}"
        AvailabilityZones: "us-east-1a"
        SubnetCidrBlocks: !Ref PrivateCidrs
        SubnetCount: "1"
        SubnetQualifier: "private"
      Tags:
        - Key: Environment
          Value: !Ref Env
        - Key: Project
          Value: "Implement VPC with single public subnet and EC2 SSH"
        - Key: Component
          Value: PrivateSubnetsNestedStack
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 10

  # SSH-only security group, open to 0.0.0.0/0
  PublicSg:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${TemplateBucket}.s3.us-east-1.amazonaws.com/cfn-nested-aws-ec2-security-group/template.yaml"
      Parameters:
        VpcId: !GetAtt Vpc.Outputs.VPCId
        ProjectName: !Ref Project
        SecurityGroupBaseName: !Ref PublicSgName
        SecurityGroupDescription: "Security group for SSH-only access"
        CiSuffix: !Ref CiSuffix
        Rule1RuleSet: "SSHOnly"
        Rule1SourceCidr: "0.0.0.0/0"
        Rule2RuleSet: "None"
        Rule3RuleSet: "None"
        Rule4RuleSet: "None"
        Rule5RuleSet: "None"
        Environment: !Ref Env
      Tags:
        - Key: Environment
          Value: !Ref Env
        - Key: Project
          Value: "Implement VPC with single public subnet and EC2 SSH"
        - Key: Component
          Value: NetworkingSSHOnlySecurityGroup
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 10

  # SSH-only security group, SSH allowed only from the public security group
  PrivateSg:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${TemplateBucket}.s3.us-east-1.amazonaws.com/cfn-nested-aws-ec2-security-group/template.yaml"
      Parameters:
        VpcId: !GetAtt Vpc.Outputs.VPCId
        ProjectName: !Ref Project
        SecurityGroupBaseName: !Ref PrivateSgName
        SecurityGroupDescription: "Security group for SSH-only access"
        CiSuffix: !Ref CiSuffix
        Rule1RuleSet: "SSHOnly"
        Rule1SourceSecurityGroupId: !GetAtt PublicSg.Outputs.SecurityGroupId
        Rule2RuleSet: "None"
        Rule3RuleSet: "None"
        Rule4RuleSet: "None"
        Rule5RuleSet: "None"
        Environment: !Ref Env
      Tags:
        - Key: Environment
          Value: !Ref Env
        - Key: Project
          Value: "Implement VPC with single public subnet and EC2 SSH"
        - Key: Component
          Value: NetworkingSSHOnlySecurityGroupPrivateSubnet
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 10

  # EC2 instance in the public subnet, with the public security group
  PublicEc2:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${TemplateBucket}.s3.us-east-1.amazonaws.com/cfn-nested-aws-ec2-instance/template.yaml"
      Parameters:
        ProjectName: !Ref Project
        InstanceBaseName: "public-ec2"
        Environment: !Ref Env
        CiSuffix: !Ref CiSuffix
        ImageId: !Ref AmiParam
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyName
        SubnetId: !GetAtt PublicSubnets.Outputs.SubnetId1
        SecurityGroupIds: !GetAtt PublicSg.Outputs.SecurityGroupId
      Tags:
        - Key: Environment
          Value: !Ref Env
        - Key: Project
          Value: "Implement VPC with single public subnet and EC2 SSH"
        - Key: Component
          Value: NetworkingEC2Instance
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 10

  # EC2 instance in the private subnet, with the private security group and key pair
  PrivateEc2:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${TemplateBucket}.s3.us-east-1.amazonaws.com/cfn-nested-aws-ec2-instance/template.yaml"
      Parameters:
        ProjectName: !Ref Project
        InstanceBaseName: "private-ec2"
        Environment: !Ref Env
        CiSuffix: !Ref CiSuffix
        ImageId: !Ref AmiParam
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyName
        SubnetId: !GetAtt PrivateSubnets.Outputs.SubnetId1
        SecurityGroupIds: !GetAtt PrivateSg.Outputs.SecurityGroupId
      Tags:
        - Key: Environment
          Value: !Ref Env
        - Key: Project
          Value: "Implement VPC with single public subnet and EC2 SSH"
        - Key: Component
          Value: NetworkingEC2Instance
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 10

Outputs:

  VpcId:
    Description: "ID of the VPC created by the nested stack"
    Value: !GetAtt Vpc.Outputs.VPCId

  IgwId:
    Description: "ID of the Internet Gateway attached to the VPC created by the nested stack"
    Value: !GetAtt Vpc.Outputs.InternetGatewayId

  PublicSubnetId:
    Description: "ID of the public subnet created by the nested subnets stack"
    Value: !GetAtt PublicSubnets.Outputs.SubnetId1

  PrivateSubnetId:
    Description: "ID of the private subnet created by the nested subnets stack"
    Value: !GetAtt PrivateSubnets.Outputs.SubnetId1

  PublicSgId:
    Description: "ID of the SSH-only security group in the public subnet"
    Value: !GetAtt PublicSg.Outputs.SecurityGroupId

  PublicSgName:
    Description: "Name of the SSH-only security group in the public subnet"
    Value: !GetAtt PublicSg.Outputs.SecurityGroupName

  PrivateSgId:
    Description: "ID of the SSH-only security group in the private subnet"
    Value: !GetAtt PrivateSg.Outputs.SecurityGroupId

  PrivateSgName:
    Description: "Name of the SSH-only security group in the private subnet"
    Value: !GetAtt PrivateSg.Outputs.SecurityGroupName

  PublicEc2Id:
    Description: "ID of the EC2 instance launched in the public subnet"
    Value: !GetAtt PublicEc2.Outputs.InstanceId

  PrivateEc2Id:
    Description: "ID of the EC2 instance launched in the private subnet"
    Value: !GetAtt PrivateEc2.Outputs.InstanceId
